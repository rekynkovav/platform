services:
  postgres:
    image: postgres:16-alpine
    mem_limit: 2g
    cpus: "2.0"
    shm_size: 256mb
    environment:
      POSTGRES_DB: platform_db
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: platform_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d platform_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - platform_network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    mem_limit: 1g
    cpus: "1.0"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/platform_db
      KC_DB_USERNAME: platform_user
      KC_DB_PASSWORD: platform_pass_2026
      KC_HOSTNAME: auth.platform.local
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx512m"
      KC_PROXY: edge
      KC_HTTP_RELATIVE_PATH: /auth
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: ["start", "--import-realm", "--http-relative-path=/auth"]
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      platform_network:
        aliases:
          - auth.platform.local

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_pass}
    ports:
      - "6379:6379"
    container_name: platform-redis
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - platform_network
    restart: unless-stopped

  rtmp:
    image: alfg/nginx-rtmp
    ports:
      - "1935:1935"
      - "8000:80"
    volumes:
      - ./rtmp.conf:/etc/nginx/nginx.conf.template:ro
      - hls:/hls
    environment:
      - HLS_PATH=/hls
    command: >
      sh -c "
        echo 'Waiting for backend DNS to be resolvable...' &&
        until getent hosts backend 2>/dev/null; do
          sleep 1
        done &&
        echo 'Backend DNS resolved, starting nginx...' &&
        envsubst '$${HLS_PATH}' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf &&
        nginx -g 'daemon off;'
      "
    restart: unless-stopped
    networks:
      - platform_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile       # ← изменено с Dockerfile на backend/Dockerfile
    mem_limit: 1g
    cpus: "1.0"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/platform_db
      DB_USERNAME: platform_user
      DB_PASSWORD: platform_pass_2026
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080/auth
      KEYCLOAK_ISSUER_URI: http://auth.platform.local/auth/realms/platform
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/platform/protocol/openid-connect/certs
      KEYCLOAK_REALM: platform
      KEYCLOAK_RESOURCE: platform-backend
      KEYCLOAK_SECRET: ${KEYCLOAK_SECRET:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass}
      MEDIA_ENCRYPTION_KEY: ${MEDIA_ENCRYPTION_KEY:-}
      MEDIA_PATH: /app/uploads
      MEDIA_BASE_URL: https://platform.local/media
      RTMP_SERVER_URL: rtmp://rtmp:1935/live
      HLS_SERVER_URL: http://rtmp:80/hls
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx512m"
    ports:
      - "8081:8081"
    volumes:
      - uploads:/app/uploads
      - hls:/hls:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - platform_network

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - platform_network

  nginx:
    image: nginx:1.26-alpine
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d/platform.conf:/etc/nginx/conf.d/platform.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - uploads:/uploads:ro
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - keycloak
    networks:
      - platform_network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: platform-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - platform_network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: platform-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - platform_network
    depends_on:
      - prometheus

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: platform-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health?local=true"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - platform_network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: platform-logstash
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9600/_node/stats"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - platform_network
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: platform-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", "http://localhost:5601/api/status"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - platform_network
    depends_on:
      - elasticsearch

  zipkin:
    image: openzipkin/zipkin:3.4.0
    container_name: platform-zipkin
    ports:
      - "9411:9411"
    networks:
      - platform_network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: platform-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - ./alerts.yml:/etc/alertmanager/alerts.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - platform_network
    restart: unless-stopped

  backup:
    image: postgres:15
    container_name: platform-backup
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh
    environment:
      - PGPASSWORD=platform_pass_2026
    command: >
      sh -c "chmod +x /backup.sh &&
             /usr/sbin/crond -b -l 8 &&
             echo '0 2 * * * /backup.sh' > /etc/crontabs/root &&
             tail -f /dev/null"
    networks:
      - platform_network
    depends_on:
      - postgres

  nginx-cdn:
    image: nginx:1.26-alpine
    container_name: platform-nginx-cdn
    ports:
      - "8001:80"
    volumes:
      - ./nginx-cdn.conf:/etc/nginx/conf.d/default.conf
    networks:
      - platform_network
    depends_on:
      - rtmp

  coturn:
    image: coturn/coturn:4.6.2
    container_name: platform-coturn
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
    command: >
      -n --fingerprint --lt-cred-mech --realm=platform.com
      --user=platform:platform123 --log-file=stdout
    networks:
      - platform_network

volumes:
  postgres_data:
  uploads:
  hls:

networks:
  platform_network:
    driver: bridge
