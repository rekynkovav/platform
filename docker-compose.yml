services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: platform_db
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: platform_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/postgres/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d platform_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - platform_network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/platform_db
      KC_DB_USERNAME: platform_user
      KC_DB_PASSWORD: platform_pass_2026
      KC_HOSTNAME: auth.platform.local
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_PROXY: edge
      KC_HTTP_RELATIVE_PATH: /auth
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: ["start-dev", "--import-realm", "--http-relative-path=/auth"]
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PROFILE: prod
      DB_URL: jdbc:postgresql://postgres:5432/platform_db
      DB_USER: platform_user
      DB_PASSWORD: platform_pass_2026
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: platform
      KEYCLOAK_CLIENT_ID: platform-backend
      MEDIA_PATH: /app/uploads
      MEDIA_BASE_URL: https://platform.local/media
      RTMP_SERVER_URL: rtmp://rtmp:1935/live
      HLS_SERVER_URL: http://rtmp:80/hls
    ports:
      - "8081:8081"
    volumes:
      - uploads:/app/uploads
      - hls:/hls:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      rtmp:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - platform_network

  rtmp:
    image: alfg/nginx-rtmp
    ports:
      - "1935:1935"
      - "8000:80"
    volumes:
      - ./rtmp.conf:/etc/nginx/nginx.conf:ro
      - hls:/hls
    environment:
      - HLS_PATH=/hls
    restart: unless-stopped
    networks:
      - platform_network

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass}
    environment:
        - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_pass}
    ports:
        - "6379:6379"
    container_name: platform-redis
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - platform_network
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - platform_network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d/platform.conf:/etc/nginx/conf.d/platform.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - uploads:/uploads:ro
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - keycloak
    networks:
      - platform_network

  prometheus:
    image: prom/prometheus:latest
    container_name: platform-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - platform_network

  grafana:
    image: grafana/grafana:latest
    container_name: platform-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - platform_network
    depends_on:
      - prometheus

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: platform-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    networks:
      - platform_network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: platform-logstash
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5000:5000"
    networks:
      - platform_network
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: platform-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - platform_network
    depends_on:
      - elasticsearch

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: platform-zipkin
    ports:
      - "9411:9411"
    networks:
      - platform_network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: platform-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - ./alerts.yml:/etc/alertmanager/alerts.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - platform_network
    restart: unless-stopped

  backup:
    image: postgres:15
    container_name: platform-backup
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh
    environment:
      - PGPASSWORD=platform_pass_2026
    command: >
      sh -c "chmod +x /backup.sh &&
             crond -b -l 8 &&
             echo '0 2 * * * /backup.sh' > /etc/crontabs/root &&
             tail -f /dev/null"
    networks:
      - platform_network
    depends_on:
      - postgres

  nginx-cdn:
    image: nginx:alpine
    container_name: platform-nginx-cdn
    ports:
      - "8001:80"
    volumes:
      - ./nginx-cdn.conf:/etc/nginx/conf.d/default.conf
    networks:
      - platform_network
    depends_on:
      - rtmp

  coturn:
    image: coturn/coturn
    container_name: platform-coturn
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
    command: >
      -n --fingerprint --lt-cred-mech --realm=platform.com
      --user=platform:platform123 --log-file=stdout
    networks:
      - platform_network

volumes:
  postgres_data:
  uploads:
  hls:

networks:
  platform_network:
    driver: bridge
