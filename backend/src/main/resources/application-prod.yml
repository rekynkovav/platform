spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/platform_db
    username: platform_user
    password: platform_pass_2026
    hikari:
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true
  liquibase:
    enabled: false

logging:
  level:
    com.platform: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.tool.schema: TRACE

app:
  media:
    upload-path: /app/uploads
    base-url: https://platform.local/media