databaseChangeLog:
  - changeSet:
      id: 1-create-media-files-table
      author: platform
      changes:
        - createTable:
            tableName: media_files
            columns:
              - column:
                  name: id
                  type: VARCHAR(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: owner_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: s3_key
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: encryption_iv
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: file_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: original_filename
                  type: VARCHAR(500)
              - column:
                  name: content_type
                  type: VARCHAR(100)
              - column:
                  name: file_size
                  type: BIGINT
              - column:
                  name: duration
                  type: INTEGER
              - column:
                  name: watermark_data
                  type: TEXT
              - column:
                  name: access_level
                  type: VARCHAR(50)
                  defaultValue: private
              - column:
                  name: hls_playlist_url
                  type: VARCHAR(500)
              - column:
                  name: thumbnail_url
                  type: VARCHAR(500)
              - column:
                  name: views_count
                  type: INTEGER
                  defaultValue: 0
              - column:
                  name: download_count
                  type: INTEGER
                  defaultValue: 0
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

        - createIndex:
            indexName: idx_media_owner_id
            tableName: media_files
            columns:
              - column:
                  name: owner_id

        - createIndex:
            indexName: idx_media_file_type
            tableName: media_files
            columns:
              - column:
                  name: file_type

        - createIndex:
            indexName: idx_media_created_at
            tableName: media_files
            columns:
              - column:
                  name: created_at

  - changeSet:
      id: 2-create-media-access-logs-table
      author: platform
      changes:
        - createTable:
            tableName: media_access_logs
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: file_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: ip_address
                  type: VARCHAR(100)
              - column:
                  name: user_agent
                  type: TEXT
              - column:
                  name: success
                  type: BOOLEAN
                  defaultValue: true
              - column:
                  name: error_message
                  type: TEXT
              - column:
                  name: accessed_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

        - createIndex:
            indexName: idx_access_file_id
            tableName: media_access_logs
            columns:
              - column:
                  name: file_id

        - createIndex:
            indexName: idx_access_user_id
            tableName: media_access_logs
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_access_timestamp
            tableName: media_access_logs
            columns:
              - column:
                  name: accessed_at
