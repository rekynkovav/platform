databaseChangeLog:
  - changeSet:
      id: 03-migrate-existing-messages-to-rooms
      author: platform
      labels: migration
      comment: Миграция существующих сообщений в чат-комнаты
      changes:
        - sql:
            sql: |
              -- Создание таблицы chat_rooms если не существует
              CREATE TABLE IF NOT EXISTS chat_rooms (
                  id VARCHAR(36) PRIMARY KEY,
                  slug VARCHAR(100) UNIQUE NOT NULL,
                  name VARCHAR(200) NOT NULL,
                  type VARCHAR(50) NOT NULL,
                  is_active BOOLEAN DEFAULT TRUE,
                  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
              );

              -- Вставка стандартных комнат
              INSERT INTO chat_rooms (id, slug, name, type, is_active, created_at) VALUES
                  ('11111111-1111-1111-1111-111111111111', 'general', 'Общий чат', 'general', true, CURRENT_TIMESTAMP),
                  ('22222222-2222-2222-2222-222222222222', 'random', 'Случайный чат', 'general', true, CURRENT_TIMESTAMP),
                  ('33333333-3333-3333-3333-333333333333', 'help', 'Помощь', 'support', true, CURRENT_TIMESTAMP)
              ON CONFLICT (id) DO NOTHING;

              -- Добавление колонки room_id если отсутствует
              DO $$
              BEGIN
                  IF NOT EXISTS (SELECT 1 FROM information_schema.columns
                      WHERE table_name='messages' AND column_name='room_id') THEN
                      ALTER TABLE messages ADD COLUMN room_id VARCHAR(36);
                  END IF;
              END $$;

              -- Добавление колонки room_slug
              DO $$
              BEGIN
                  IF NOT EXISTS (SELECT 1 FROM information_schema.columns
                      WHERE table_name='messages' AND column_name='room_slug') THEN
                      ALTER TABLE messages ADD COLUMN room_slug VARCHAR(100);
                  END IF;
              END $$;

              -- Добавление колонки chat_type
              DO $$
              BEGIN
                  IF NOT EXISTS (SELECT 1 FROM information_schema.columns
                      WHERE table_name='messages' AND column_name='chat_type') THEN
                      ALTER TABLE messages ADD COLUMN chat_type VARCHAR(50) DEFAULT 'general';
                  END IF;
              END $$;

              -- Миграция существующих сообщений
              UPDATE messages
              SET room_id = '11111111-1111-1111-1111-111111111111',
                  room_slug = 'general',
                  chat_type = 'general'
              WHERE room_id IS NULL;

              -- Создание индексов
              CREATE INDEX IF NOT EXISTS idx_messages_room_id ON messages(room_id);
              CREATE INDEX IF NOT EXISTS idx_messages_room_slug ON messages(room_slug);

              -- Добавление внешнего ключа
              ALTER TABLE messages
              ADD CONSTRAINT fk_messages_room
              FOREIGN KEY (room_id) REFERENCES chat_rooms(id)
              ON DELETE SET NULL;