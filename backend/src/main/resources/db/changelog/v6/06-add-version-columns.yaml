databaseChangeLog:
  - changeSet:
      id: 06-add-version-columns
      author: platform
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: payments
              columnName: version
      changes:
        - sql:
            sql: ALTER TABLE payments ADD COLUMN IF NOT EXISTS version BIGINT DEFAULT 0;
        - sql:
            sql: ALTER TABLE users ADD COLUMN IF NOT EXISTS version BIGINT DEFAULT 0;
        - sql:
            sql: ALTER TABLE live_broadcasts ADD COLUMN IF NOT EXISTS version BIGINT DEFAULT 0;
        - sql:
            sql: ALTER TABLE messages ADD COLUMN IF NOT EXISTS version BIGINT DEFAULT 0;
