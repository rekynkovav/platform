databaseChangeLog:
  - changeSet:
      id: 07-additional-indexes
      author: platform
      labels: performance
      comment: Дополнительные индексы для производительности
      runInTransaction: false
      changes:
        - sql:
            sql: |
              CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_messages_user_id
              ON messages(user_id);

              CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_messages_deleted_at
              ON messages(deleted_at) WHERE deleted_at IS NOT NULL;

              CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_live_broadcasts_owner_id
              ON live_broadcasts(owner_id, status);

              CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_payments_expires_at
              ON payments(expires_at) WHERE status = 'PENDING';

              ANALYZE messages;
              ANALYZE live_broadcasts;
              ANALYZE payments;