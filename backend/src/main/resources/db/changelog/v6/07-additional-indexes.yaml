databaseChangeLog:
  - changeSet:
      id: 07-additional-indexes
      author: platform
      labels: performance
      comment: Дополнительные индексы для производительности
      runInTransaction: false
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_messages_user_id
      changes:
        - sql:
            sql: |
              CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_messages_user_id ON messages(user_id);
        - sql:
            sql: |
              CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_messages_deleted_at ON messages(deleted_at) WHERE deleted_at IS NOT NULL;
        - sql:
            sql: |
              CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_live_broadcasts_owner_id ON live_broadcasts(owner_id, status);
        - sql:
            sql: |
              CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_payments_expires_at ON payments(expires_at) WHERE status = 'PENDING';
        - sql:
            sql: ANALYZE messages;
        - sql:
            sql: ANALYZE live_broadcasts;
        - sql:
            sql: ANALYZE payments;
