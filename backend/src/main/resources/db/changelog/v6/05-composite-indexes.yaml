databaseChangeLog:
  - changeSet:
      id: 05-composite-indexes
      author: platform
      labels: performance
      comment: Составные индексы для производительности
      runInTransaction: false
      failOnError: false
      changes:
        - sql:
            sql: |
              CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_messages_room_created
              ON messages(room_id, created_at DESC);
        - sql:
            sql: |
              CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_payments_user_created
              ON payments(user_id, created_at DESC);
        - sql:
            sql: |
              CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_notifications_user_read_created
              ON notifications(user_id, is_read, created_at DESC);
        - sql:
            sql: |
              CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_live_broadcasts_status_started
              ON live_broadcasts(status, started_at DESC);
        - sql:
            sql: |
              CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_messages_active
              ON messages(created_at DESC) WHERE deleted_at IS NULL;
        - sql:
            sql: |
              CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_payments_pending
              ON payments(created_at) WHERE status = 'PENDING';
        - sql:
            sql: ANALYZE messages;
        - sql:
            sql: ANALYZE payments;
        - sql:
            sql: ANALYZE notifications;
        - sql:
            sql: ANALYZE live_broadcasts;
