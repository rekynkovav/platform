databaseChangeLog:
  - changeSet:
      id: 04-convert-strings-to-uuids
      author: platform
      labels: migration
      comment: Конвертация String ID в UUID
      changes:
        - sql:
            sql: |
              -- Проверка и конвертация users
              DO $$
              BEGIN
                  IF EXISTS (SELECT 1 FROM information_schema.columns
                      WHERE table_name='users' AND column_name='id' AND data_type='varchar') THEN

                      ALTER TABLE users ADD COLUMN new_id UUID;
                      UPDATE users SET new_id = id::uuid WHERE id ~ '^[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}$';
                      ALTER TABLE users DROP CONSTRAINT users_pkey CASCADE;
                      ALTER TABLE users DROP COLUMN id CASCADE;
                      ALTER TABLE users RENAME COLUMN new_id TO id;
                      ALTER TABLE users ADD PRIMARY KEY (id);
                  END IF;
              END $$;

              -- Аналогично для messages
              DO $$
              BEGIN
                  IF EXISTS (SELECT 1 FROM information_schema.columns
                      WHERE table_name='messages' AND column_name='id' AND data_type='varchar') THEN

                      ALTER TABLE messages ADD COLUMN new_id UUID;
                      UPDATE messages SET new_id = id::uuid WHERE id ~ '^[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}$';
                      ALTER TABLE messages DROP CONSTRAINT messages_pkey CASCADE;
                      ALTER TABLE messages DROP COLUMN id CASCADE;
                      ALTER TABLE messages RENAME COLUMN new_id TO id;
                      ALTER TABLE messages ADD PRIMARY KEY (id);
                  END IF;
              END $$;