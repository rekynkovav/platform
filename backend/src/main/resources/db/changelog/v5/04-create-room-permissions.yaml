databaseChangeLog:
  - changeSet:
      id: 04-create-room-permissions
      author: grok-xirurg
      labels: schema
      comment: "Потолочная таблица прав доступа на уровне комнат (room-level permissions)"
      changes:
        - createTable:
            tableName: chat_room_permissions
            remarks: "Кто и какие права имеет в конкретной комнате"
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: room_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                  remarks: "ROLE_USER, ROLE_CONSULTANT_PITANIE, ROLE_VYACHESLAV и т.д."
              - column:
                  name: permission_level
                  type: VARCHAR(20)
                  defaultValue: "read_write"
                  remarks: "read | read_write | admin"
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP

        - addForeignKeyConstraint:
            constraintName: fk_room_permissions_room
            baseTableName: chat_room_permissions
            baseColumnNames: room_id
            referencedTableName: chat_rooms
            referencedColumnNames: id
            onDelete: CASCADE

        - createIndex:
            indexName: idx_room_permissions_room_role
            tableName: chat_room_permissions
            columns:
              - column: { name: room_id }
              - column: { name: role }