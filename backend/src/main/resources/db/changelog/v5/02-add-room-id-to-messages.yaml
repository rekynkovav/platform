databaseChangeLog:
  - changeSet:
      id: 02-add-room-id-to-messages
      author: grok-xirurg
      labels: schema
      comment: "Добавляем room_id — потолочная связь Message → ChatRoom. Старые chat_type и recipient_id оставляем как deprecated"
      changes:
        - addColumn:
            tableName: messages
            columns:
              - column:
                  name: room_id
                  type: BIGINT
                  remarks: "Ссылка на chat_rooms.id — единая нормализованная сущность"
              - column:
                  name: room_slug
                  type: VARCHAR(100)
                  remarks: "Денормализованный slug для быстрого поиска и совместимости с фронтом (user1, nutrition и т.д.)"

        - addForeignKeyConstraint:
            constraintName: fk_messages_room
            baseTableName: messages
            baseColumnNames: room_id
            referencedTableName: chat_rooms
            referencedColumnNames: id
            onDelete: CASCADE

        - createIndex:
            indexName: idx_messages_room_id_created_at
            tableName: messages
            columns:
              - column:
                  name: room_id
              - column:
                  name: created_at
                  descending: true

        - createIndex:
            indexName: idx_messages_room_slug
            tableName: messages
            columns:
              - column:
                  name: room_slug