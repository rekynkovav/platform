# src/main/resources/db/changelog/v1/06-create-messages-table.yaml
databaseChangeLog:
  - changeSet:
      id: 06-create-messages-table
      author: platform
      labels: schema
      comment: Создание таблицы messages (сообщения чата)
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: messages
      changes:
        - createTable:
            tableName: messages
            remarks: Сообщения в чатах
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  remarks: UUID сообщения
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: content
                  type: TEXT
                  remarks: Текст сообщения
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(36)
                  remarks: ID отправителя
                  constraints:
                    nullable: false
              - column:
                  name: user_name
                  type: VARCHAR(128)
                  remarks: Имя отправителя
              - column:
                  name: chat_type
                  type: VARCHAR(32)
                  defaultValue: general
                  remarks: Тип чата (general, admin_group, admin_private)
                  constraints:
                    nullable: false
              - column:
                  name: recipient_id
                  type: VARCHAR(36)
                  remarks: ID получателя (для личных сообщений)
              - column:
                  name: is_read
                  type: BOOLEAN
                  defaultValue: false
                  remarks: Прочитано
              - column:
                  name: deleted_at
                  type: TIMESTAMPTZ
                  remarks: Дата мягкого удаления
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: Дата создания
        - addForeignKeyConstraint:
            constraintName: fk_messages_user
            baseTableName: messages
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_messages_recipient
            baseTableName: messages
            baseColumnNames: recipient_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: SET NULL
