# src/main/resources/db/changelog/v1/01-create-users-table.yaml
databaseChangeLog:
  - changeSet:
      id: 01-create-users-table
      author: platform
      labels: schema
      comment: Создание таблицы users
      changes:
        - createTable:
            tableName: users
            remarks: Пользователи платформы (синхронизация с Keycloak)
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  remarks: UUID пользователя (из Keycloak)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(64)
                  remarks: Имя пользователя
                  constraints:
                    unique: true
              - column:
                  name: email
                  type: VARCHAR(255)
                  remarks: Email пользователя
              - column:
                  name: phone
                  type: VARCHAR(32)
                  remarks: Номер телефона
              - column:
                  name: role
                  type: VARCHAR(32)
                  defaultValue: user
                  remarks: Роль пользователя (user, moderator, admin)
                  constraints:
                    nullable: false
              - column:
                  name: avatar_url
                  type: VARCHAR(512)
                  remarks: Ссылка на аватар
              - column:
                  name: bio
                  type: TEXT
                  remarks: Информация о пользователе
              - column:
                  name: last_active_at
                  type: TIMESTAMPTZ
                  remarks: Время последней активности
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: Дата создания
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: Дата обновления
              - column:
                  name: banned
                  type: BOOLEAN
                  defaultValue: false
                  remarks: Забанен ли пользователь
              - column:
                  name: ban_reason
                  type: TEXT
                  remarks: Причина бана
              - column:
                  name: banned_at
                  type: TIMESTAMPTZ
                  remarks: Дата бана