# src/main/resources/db/changelog/v1/10-create-notifications-table.yaml
databaseChangeLog:
  - changeSet:
      id: 10-create-notifications-table
      author: platform
      labels: schema
      comment: Создание таблицы notifications (уведомления)
      changes:
        - createTable:
            tableName: notifications
            remarks: Пользовательские уведомления
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  remarks: UUID уведомления
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(36)
                  remarks: ID получателя
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  remarks: Тип уведомления (like, comment, broadcast_start, system)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  remarks: Заголовок
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: TEXT
                  remarks: Текст уведомления
              - column:
                  name: is_read
                  type: BOOLEAN
                  defaultValue: false
                  remarks: Прочитано
                  constraints:
                    nullable: false
              - column:
                  name: reference_type
                  type: VARCHAR(50)
                  remarks: Тип связанной сущности (post, event, broadcast)
              - column:
                  name: reference_id
                  type: VARCHAR(36)
                  remarks: ID связанной сущности
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: Дата создания
        - addForeignKeyConstraint:
            constraintName: fk_notifications_user
            baseTableName: notifications
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
