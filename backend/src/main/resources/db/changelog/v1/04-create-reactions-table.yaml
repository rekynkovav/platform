# src/main/resources/db/changelog/v1/04-create-reactions-table.yaml
databaseChangeLog:
  - changeSet:
      id: 04-create-reactions-table
      author: platform
      labels: schema
      comment: Создание таблицы reactions (лайки/реакции)
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: reactions
      changes:
        - createTable:
            tableName: reactions
            remarks: Реакции пользователей на посты
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  remarks: UUID реакции
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: post_id
                  type: VARCHAR(36)
                  remarks: ID поста
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(36)
                  remarks: ID пользователя
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(32)
                  remarks: Тип реакции (like, love, laugh, etc.)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: Дата создания
        - addUniqueConstraint:
            constraintName: uk_reactions_post_user_type
            tableName: reactions
            columnNames: post_id, user_id, type
        - addForeignKeyConstraint:
            constraintName: fk_reactions_post
            baseTableName: reactions
            baseColumnNames: post_id
            referencedTableName: posts
            referencedColumnNames: id
            onDelete: CASCADE
