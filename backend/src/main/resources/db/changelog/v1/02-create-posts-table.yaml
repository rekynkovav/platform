# src/main/resources/db/changelog/v1/02-create-posts-table.yaml
databaseChangeLog:
  - changeSet:
      id: 02-create-posts-table
      author: platform
      labels: schema
      comment: Создание таблицы posts (посты в ленте)
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: posts
      changes:
        - createTable:
            tableName: posts
            remarks: Посты в ленте новостей
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  remarks: UUID поста
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: content
                  type: TEXT
                  remarks: Текст поста
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: VARCHAR(36)
                  remarks: ID автора (из Keycloak)
                  constraints:
                    nullable: false
              - column:
                  name: author_name
                  type: VARCHAR(128)
                  remarks: Имя автора
              - column:
                  name: author_role
                  type: VARCHAR(32)
                  remarks: Роль автора
              - column:
                  name: media_url
                  type: VARCHAR(512)
                  remarks: Ссылка на медиафайл
              - column:
                  name: media_type
                  type: VARCHAR(16)
                  remarks: Тип медиа (image, video)
              - column:
                  name: likes_count
                  type: INTEGER
                  defaultValue: 0
                  remarks: Количество лайков
              - column:
                  name: comments_count
                  type: INTEGER
                  defaultValue: 0
                  remarks: Количество комментариев
              - column:
                  name: shares_count
                  type: INTEGER
                  defaultValue: 0
                  remarks: Количество репостов
              - column:
                  name: views_count
                  type: INTEGER
                  defaultValue: 0
                  remarks: Количество просмотров
              - column:
                  name: is_pinned
                  type: BOOLEAN
                  defaultValue: false
                  remarks: Закреплённый пост
              - column:
                  name: flagged
                  type: BOOLEAN
                  defaultValue: false
                  remarks: Флаг помеченного поста (для модерации)
              - column:
                  name: moderated_at
                  type: TIMESTAMPTZ
                  remarks: Дата модерации
              - column:
                  name: moderated_by
                  type: VARCHAR(36)
                  remarks: ID модератора
              - column:
                  name: moderation_reason
                  type: TEXT
                  remarks: Причина модерации
              - column:
                  name: deleted_at
                  type: TIMESTAMPTZ
                  remarks: Дата мягкого удаления
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: Дата создания
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: Дата обновления
        - addForeignKeyConstraint:
            constraintName: fk_posts_author
            baseTableName: posts
            baseColumnNames: author_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - sql:
            sql: ALTER TABLE posts ADD CONSTRAINT chk_posts_media_type CHECK (media_type IN ('image', 'video', NULL))
