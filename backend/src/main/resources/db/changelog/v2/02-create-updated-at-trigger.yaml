# src/main/resources/db/changelog/v2/02-create-updated-at-trigger.yaml
databaseChangeLog:
  - changeSet:
      id: 02-create-updated-at-trigger
      author: platform
      labels: schema
      comment: Создание функции и триггера для автоматического обновления updated_at
      changes:
        - sql:
            sql: |
              CREATE OR REPLACE FUNCTION update_updated_at_column()
              RETURNS TRIGGER AS $$
              BEGIN
                  NEW.updated_at = CURRENT_TIMESTAMP;
                  RETURN NEW;
              END;
              $$ language 'plpgsql';
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trigger_users_updated_at ON users;
              CREATE TRIGGER trigger_users_updated_at
                  BEFORE UPDATE ON users
                  FOR EACH ROW
                  EXECUTE FUNCTION update_updated_at_column();
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trigger_posts_updated_at ON posts;
              CREATE TRIGGER trigger_posts_updated_at
                  BEFORE UPDATE ON posts
                  FOR EACH ROW
                  EXECUTE FUNCTION update_updated_at_column();
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trigger_comments_updated_at ON comments;
              CREATE TRIGGER trigger_comments_updated_at
                  BEFORE UPDATE ON comments
                  FOR EACH ROW
                  EXECUTE FUNCTION update_updated_at_column();
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trigger_events_updated_at ON events;
              CREATE TRIGGER trigger_events_updated_at
                  BEFORE UPDATE ON events
                  FOR EACH ROW
                  EXECUTE FUNCTION update_updated_at_column();
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trigger_archives_updated_at ON archives;
              CREATE TRIGGER trigger_archives_updated_at
                  BEFORE UPDATE ON archives
                  FOR EACH ROW
                  EXECUTE FUNCTION update_updated_at_column();
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trigger_contacts_updated_at ON contacts;
              CREATE TRIGGER trigger_contacts_updated_at
                  BEFORE UPDATE ON contacts
                  FOR EACH ROW
                  EXECUTE FUNCTION update_updated_at_column();