# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/platform
spring.datasource.username=platform
spring.datasource.password=platform123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# Security - OAuth2 Resource Server (Keycloak)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/platform
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/platform/protocol/openid-connect/certs

# Keycloak Admin Client
keycloak.auth-server-url=http://localhost:8080
keycloak.realm=platform
keycloak.resource=platform-backend
keycloak.credentials.secret=your-client-secret-here

# Storage
app.storage.local-path=./uploads
app.storage.temp-path=/tmp/platform-media

# Watermark
app.watermark.font-path=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
app.watermark.temp-path=/tmp/watermarks

# HLS
media.hls.enabled=true
media.hls.segment-duration=6

# Encryption
media.encryption.master-key=change-this-to-strong-random-key-in-production
media.encryption.algorithm=AES/CBC/PKCS5Padding

# Yandex S3 (for production)
yandex.s3.access-key=
yandex.s3.secret-key=
yandex.s3.bucket=platform-media
yandex.s3.endpoint=https://storage.yandexcloud.net
yandex.s3.region=ru-central1

# Logging
logging.level.com.platform=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.keycloak=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Upload limits
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
app.upload.max-size=1073741824

# Redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.slo.http.server.requests=10ms,100ms,1s

# Logstash
logging.logstash.enabled=true
logging.logstash.host=localhost:5000

# Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans