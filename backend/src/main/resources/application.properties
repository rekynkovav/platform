# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/platform
spring.datasource.username=platform
spring.datasource.password=platform123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=false

# Security
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/platform/protocol/openid-connect/certs

# Keycloak
keycloak.auth-server-url=http://localhost:8080
keycloak.realm=platform
keycloak.resource=platform-backend
keycloak.credentials.secret=your-client-secret

# Storage
app.storage.local-path=./uploads
app.storage.temp-path=/tmp/platform-media

# Watermark
app.watermark.font-path=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
app.watermark.temp-path=/tmp/watermarks

# HLS
media.hls.enabled=true
media.hls.segment-duration=6

# Encryption
media.encryption.master-key=change-this-to-strong-random-key-in-production
media.encryption.algorithm=AES/CBC/PKCS5Padding

# Yandex S3 (for production)
yandex.s3.access-key=
yandex.s3.secret-key=
yandex.s3.bucket=platform-media
yandex.s3.endpoint=https://storage.yandexcloud.net
yandex.s3.region=ru-central1

# Logging
logging.level.com.platform=DEBUG
logging.level.org.springframework.web.socket=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info,metrics