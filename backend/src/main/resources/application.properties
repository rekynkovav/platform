# Server
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/platform_db
spring.datasource.username=platform_user
spring.datasource.password=platform_pass_2026
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:redis_pass}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Actuator & Metrics
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.metrics.tags.application=platform
management.metrics.tags.environment=prod
management.metrics.export.prometheus.enabled=true
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.db=true
management.metrics.enable.http=true
management.health.redis.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true

# Zipkin Tracing
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.tracing.sampling.probability=1.0
management.tracing.baggage.correlation-fields=userId,role

# Logging
logging.pattern.console=

# Логирование медленных запросов
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=1000
logging.level.org.hibernate.SQL_SLOW=WARN
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG

# Логирование параметров запросов (только для dev)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# bucket4j
bucket4j.enabled=true
bucket4j.filters[0].cache-name=buckets
bucket4j.filters[0].url=/api/**
bucket4j.filters[0].rate-limits[0].bandwidths[0].capacity=1000
bucket4j.filters[0].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[0].rate-limits[0].bandwidths[0].unit=minutes
bucket4j.filters[0].rate-limits[0].bandwidths[0].refill-speed=interval

# Admin rate limiting
bucket4j.filters[1].cache-name=admin-buckets
bucket4j.filters[1].url=/api/admin/.*
bucket4j.filters[1].http-status-code=429
bucket4j.filters[1].rate-limits[0].bandwidths[0].capacity=500
bucket4j.filters[1].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[1].rate-limits[0].bandwidths[0].unit=minutes
# OpenAPI/Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.platform.controller
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha

# HikariCP Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=PlatformHikariPool

# Отключаем Open Session in View (лучше для производительности)
spring.jpa.open-in-view=false

# Включаем ленивую загрузку без транзакции (осторожно!)
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Размер пакетной загрузки
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# Оптимизация для readOnly транзакций
spring.jpa.properties.hibernate.read_only=true

# Hibernate L2 Cache и Query Cache отключены: в pom.xml нет hibernate-jcache/javax.cache-api,
# используется только Caffeine через Spring Cache (@Cacheable). Настройка region.factory_class=jcache
# вызывала Unable to resolve name [jcache] as strategy [RegionFactory].
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# File upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=/tmp

# Chat message size limits (10KB per message)
spring.servlet.multipart.max-file-size=10KB
spring.servlet.multipart.max-request-size=10KB

# WebSocket message size limits
spring.websocket.max-text-message-size=10240
spring.websocket.max-binary-message-size=10240
spring.websocket.send-time-limit=5000
spring.websocket.send-buffer-size-limit=512000

# Tomcat limits
server.tomcat.max-http-form-post-size=104857600
server.tomcat.max-swallow-size=104857600

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.tomcat.graceful-shutdown.wait-for-active-sessions=true

# Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=2048

# Timezone
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
