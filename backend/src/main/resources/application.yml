spring:
  application:
    name: platform-backend
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - com.giffing.bucket4j.spring.boot.starter.Bucket4jAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  liquibase:
    enabled: false

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  cache:
    type: redis

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/auth/realms/platform}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/auth/realms/platform/protocol/openid-connect/certs}

  web:
    resources:
      static-locations: classpath:/static/

bucket4j:
  enabled: false

server:
  port: 8081
  servlet:
    context-path: /

logging:
  level:
    com.platform: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  watermark:
    font-path: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
    temp-path: /tmp/watermarks

  storage:
    type: s3

  hls:
    enabled: true
    segment-duration: 10
    playlist-length: 3

  media:
    encryption:
      master-key: ${MEDIA_ENCRYPTION_KEY:}
      algorithm: "AES/GCM/NoPadding"

keycloak:
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://keycloak:8080/auth}
  realm: ${KEYCLOAK_REALM:platform}
  resource: ${KEYCLOAK_RESOURCE:platform-backend}
  credentials:
    secret: ${KEYCLOAK_SECRET:}
