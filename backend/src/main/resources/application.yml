spring:
  application:
    name: platform-backend
  main:
    allow-circular-references: true
  autoconfigure:
    exclude:
      - com.giffing.bucket4j.spring.boot.starter.Bucket4jAutoConfiguration

bucket4j:
  enabled: true
  cache-to-use: caffeine
  methods:
    - name: "dummy"
      cache-name: buckets
      rate-limits:
        - bandwidths:
            - capacity: 100
              time: 1
              unit: minutes
              refill-speed: interval

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=5m

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/platform}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/platform/protocol/openid-connect/certs}

  web:
    resources:
      static-locations: classpath:/static/

server:
  port: 8081
  servlet:
    context-path: /

logging:
  level:
    com.platform: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE


app:
  watermark:
    font-path: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
    temp-path: /tmp/watermarks

  storage:
    type: s3
    # Yandex Cloud S3 configuration - see application-prod.yml for production settings
    # For local development, use LocalStorageService (default)

  encryption:
    algorithm: AES/GCM/NoPadding
    key-size: 256

  hls:
    enabled: true
    segment-duration: 10
    playlist-length: 3

  media:
    encryption:
      master-key: ${MEDIA_ENCRYPTION_KEY:}
      algorithm: "AES/CBC/PKCS5Padding"

keycloak:
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:platform}
  resource: ${KEYCLOAK_RESOURCE:platform-backend}
  credentials:
    secret: ${KEYCLOAK_SECRET:}


