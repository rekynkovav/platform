spring:
  application:
    name: platform-backend
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      []

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  liquibase:
    enabled: true

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  cache:
    type: redis

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/auth/realms/platform}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/auth/realms/platform/protocol/openid-connect/certs}

  web:
    resources:
      static-locations: classpath:/static/

bucket4j:
  enabled: true

server:
  port: 8081
  servlet:
    context-path: /

logging:
  level:
    com.platform: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: INFO

app:
  watermark:
    font-path: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
    temp-path: /tmp/watermarks

  storage:
    type: s3

  hls:
    enabled: true
    segment-duration: 10
    playlist-length: 3

  media:
    encryption:
      master-key: ${MEDIA_ENCRYPTION_KEY:}
      algorithm: "AES/GCM/NoPadding"

  payment:
    recipient-name: ${PAYMENT_RECIPIENT_NAME:БФАДД}
    account: ${PAYMENT_ACCOUNT:40703810512000002359}
    bank: ${PAYMENT_BANK:ВОЛОГОДСКОЕ ОТДЕЛЕНИЕ N8638 ПАО СБЕРБАНК г. Вологда}
    bik: ${PAYMENT_BIK:041909644}
    corr-account: ${PAYMENT_CORR_ACCOUNT:30101810900000000644}
    inn: ${PAYMENT_INN:9715470089}
    kpp: ${PAYMENT_KPP:771501001}

keycloak:
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://keycloak:8080/auth}
  realm: ${KEYCLOAK_REALM:platform}
  resource: ${KEYCLOAK_RESOURCE:platform-backend}
  credentials:
    secret: ${KEYCLOAK_SECRET:}
