spring:
  config:
    activate:
      on-profile: test
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisKeyValueAutoConfiguration
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: testpass
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri:
  cache:
    type: none

# Encryption (required by EncryptionService)
app:
  media:
    encryption:
      master-key: dGVzdC1lbmNyeXB0aW9uLWtleS0xMjM0NTY3ODkw

# Storage
storage:
  local-path: /tmp/platform-test-uploads

# Keycloak (mocked in tests)
keycloak:
  auth-server-url: http://localhost:0
  realm: test
  resource: test
  credentials:
    secret: test-secret

# RTMP
rtmp:
  webhook:
    secret: test-webhook-secret

# Disable bucket4j rate limiting
bucket4j:
  enabled: false

test:
  mockmvc:
    add-filters: false

logging:
  level:
    com.platform: WARN

server:
  port: 0
