spring:
  config:
    activate:
      on-profile: integration
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisKeyValueAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
  # DO NOT exclude LiquibaseAutoConfiguration — that's the point
  # DO NOT exclude FlywayAutoConfiguration — project doesn't use it, but no harm leaving default
  datasource:
    url: jdbc:tc:postgresql:16:///platform_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  liquibase:
    enabled: true
  cache:
    type: none

# Encryption (required by EncryptionService)
app:
  media:
    encryption:
      master-key: dGVzdC1lbmNyeXB0aW9uLWtleS0xMjM0NTY3ODkw

# Storage
storage:
  local-path: /tmp/platform-test-uploads

# Keycloak (mocked in integration tests)
keycloak:
  auth-server-url: http://localhost:0
  realm: test
  resource: test
  credentials:
    secret: test-secret

# RTMP
rtmp:
  webhook:
    secret: test-webhook-secret

# Disable bucket4j rate limiting
bucket4j:
  enabled: false

test:
  mockmvc:
    add-filters: false

logging:
  level:
    com.platform: INFO
    org.testcontainers: INFO

server:
  port: 0
