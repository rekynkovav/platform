<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' 'unsafe-inline' https://auth.platform.local;
                   style-src 'self' 'unsafe-inline';
                   connect-src 'self' http://localhost:8081 https://auth.platform.local wss://api.platform.local https://api.platform.local;
                   frame-src 'self' https://auth.platform.local;
                   img-src 'self' data: https:;
                   font-src 'self' data:;">
    <title>Platform</title>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light' || savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>
<body>
<div id="root"></div>
</body>
</html>
