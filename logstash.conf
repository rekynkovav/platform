input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  json {
    source => "message"
    target => "log"
    skip_on_invalid_json => true
  }

  mutate {
    add_field => {
      "application" => "platform-backend"
      "environment" => "prod"
    }
  }

  if [log][level] {
    mutate {
      add_field => { "log_level" => "%{[log][level]}" }
    }
  }

  if [logger] {
    mutate {
      add_field => { "logger_name" => "%{logger}" }
    }
  }

  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "platform-logs-%{+YYYY.MM.dd}"
    user => ""
    password => ""
  }

  stdout {
    codec => rubydebug
  }
}