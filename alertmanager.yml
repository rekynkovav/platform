global:
  resolve_timeout: 5m
  slack_api_url: ""  # Заполнить при наличии Slack

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 4h
  receiver: 'webhook'
  routes:
    - match:
        severity: critical
      receiver: 'critical-webhook'
      group_wait: 5s
      repeat_interval: 1h

receivers:
  - name: 'webhook'
    webhook_configs:
      - url: 'http://backend:8081/api/alerts'
        send_resolved: true

  - name: 'critical-webhook'
    webhook_configs:
      - url: 'http://backend:8081/api/alerts/critical'
        send_resolved: true