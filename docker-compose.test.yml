services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: platform_db
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: platform_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d platform_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/platform_db
      KC_DB_USERNAME: platform_user
      KC_DB_PASSWORD: platform_pass_2026
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: true
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_PROXY_HEADERS: xforwarded
      # Добавляем эти настройки для отключения iframe проверки
      KC_SPI_EVENTS_LISTENER_JBOSS_LOGGING_SUCCESS_LEVEL: info
      KC_SPI_EVENTS_LISTENER_JBOSS_LOGGING_ERROR_LEVEL: warn
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command:
      - "start-dev"
      - "--http-relative-path=/auth"
      - "--hostname=localhost"
      - "--hostname-strict=false"
      - "--spi-login-protocol-openid-connect-legacy-logout-redirect-uri=true"
      - "--spi-login-protocol-openid-connect-suppress-login-consent=true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PROFILE: test
      DB_URL: jdbc:postgresql://postgres:5432/platform_db
      DB_USER: platform_user
      DB_PASSWORD: platform_pass_2026
      KEYCLOAK_URL: http://keycloak:8080/auth  # ← внутренний URL
      KEYCLOAK_REALM: platform
      KEYCLOAK_CLIENT_ID: platform-backend
      MEDIA_PATH: /app/uploads
      MEDIA_BASE_URL: http://localhost/media
      SPRING_PROFILES_ACTIVE: test
    ports:
      - "8081:8081"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      REACT_APP_API_URL: http://localhost/api
      REACT_APP_KEYCLOAK_URL: http://localhost/auth
      REACT_APP_KEYCLOAK_REALM: platform
      REACT_APP_KEYCLOAK_CLIENT_ID: platform-frontend
      NODE_ENV: development
      # Добавьте эти переменные для принудительного использования правильных URL
      PUBLIC_URL: http://localhost
      WDS_SOCKET_PORT: 0
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/test.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/uploads:ro
    depends_on:
      - frontend
      - backend
      - keycloak
    restart: unless-stopped

volumes:
  postgres_data:
  uploads: